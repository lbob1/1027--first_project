name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg
          POSTGRES_DB: miniknora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci_pg@localhost:5432/miniknora_ci
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: miniknora
      OPENAI_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHAT_MODEL: qwen3.7-plus
      EMBEDDING_MODEL: text-embedding-v3
      EMBEDDING_DIM: "1024"
      RERANK_ENABLED: "false"
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Init DB tables
        run: uv run python -m app.models.init_db

      - name: Full test suite
        run: uv run pytest -q

  container-image:
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: container-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.yaml,compose.prod.yml,Caddyfile"
          target: /opt/miniknora
          overwrite: true

      - name: Copy frontend to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "front-end page/dist/index.html"
          strip_components: 2
          target: /opt/miniknora/frontend
          overwrite: true

      - name: Rollout and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/miniknora
            set -a; source .env.deploy; set +a
            echo "$GHCR_TOKEN" | docker login ghcr.io -u lbob1 --password-stdin
            docker compose --env-file .env -f compose.yaml -f compose.prod.yml pull api worker caddy
            docker compose --env-file .env -f compose.yaml -f compose.prod.yml up -d --wait
            curl -fsS http://127.0.0.1:8000/healthz
            echo "DEPLOY_OK ${{ github.sha }}"
