name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci_pg@localhost:5432/miniknora_ci
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: miniknora
      OPENAI_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHAT_MODEL: qwen3.7-plus
      EMBEDDING_MODEL: text-embedding-v3
      EMBEDDING_DIM: "1024"
      RERANK_ENABLED: "false"
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef
    steps:
      - name: Start infra containers (PG+pgvector / MinIO, with mirror fallback)
        run: |
          set -e
          # Docker Hub 对 GitHub 共享出口 IP 限流：直连失败自动切 daocloud 镜像源
          pull() {
            docker pull "$1" || { echo "::warning::direct pull failed, trying mirror"; docker pull "docker.m.daocloud.io/$1"; }
          }
          pull pgvector/pgvector:pg16
          docker run -d --name ci-pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci_pg -e POSTGRES_DB=miniknora_ci \
            -p 5432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U postgres >/dev/null 2>&1 && break
            [ "$i" = 30 ] && exit 1
            sleep 2
          done
          # MinIO 社区版 2025-10 起停发（官方 quay.io/docker.io 仓库已清空，dl.min.io 返回 410），
          # 改用活跃维护的分叉 pgsty/minio（drop-in 兼容：同 env、同 server 命令、同端口）
          docker pull pgsty/minio:RELEASE.2026-06-18T00-00-00Z
          docker run -d --name ci-minio \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 pgsty/minio:RELEASE.2026-06-18T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { docker logs ci-minio; exit 1; }
            sleep 2
          done
          echo "infra ready"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Init DB tables
        run: uv run python -m app.models.init_db

      - name: Full test suite
        run: uv run pytest -q

  container-image:
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pre-pull base image with mirror fallback
        run: |
          docker pull python:3.12-slim || { docker pull docker.m.daocloud.io/library/python:3.12-slim && docker tag docker.m.daocloud.io/library/python:3.12-slim python:3.12-slim; }

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: container-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.yaml,compose.prod.yml,Caddyfile"
          target: /opt/miniknora
          overwrite: true

      - name: Copy frontend to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "front-end page/dist/index.html"
          strip_components: 2
          target: /opt/miniknora/frontend
          overwrite: true

      # 服务器直连 ghcr.io 长连接僵死（跨境），改为 runner 内网秒级拉取后打包直传
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and pack image
        run: |
          docker pull ghcr.io/lbob1/1027--first_project:latest
          docker save ghcr.io/lbob1/1027--first_project:latest | gzip > miniknora-image.tar.gz
          ls -lh miniknora-image.tar.gz

      # 跨境大文件直传易断流（实测 scp 1.5h 未完成）：改 rsync 断点续传 + 重试循环
      - name: Transfer image to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_KEY" > ssh_key && chmod 600 ssh_key
          SSH_OPTS="-i ssh_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          n=0
          until rsync -e "ssh $SSH_OPTS" --partial --append --timeout=90 \
              miniknora-image.tar.gz "$SSH_USER@$SSH_HOST:/opt/miniknora/"; do
            n=$((n+1)); [ $n -ge 40 ] && echo "retries exhausted" && exit 1
            echo "::notice::transfer interrupted, resuming (attempt $n)"
            sleep 5
          done

      - name: Rollout and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/miniknora
            gunzip -c miniknora-image.tar.gz | docker load
            rm -f miniknora-image.tar.gz
            docker compose --env-file .env -f compose.yaml -f compose.prod.yml up -d --wait
            curl -fsS http://127.0.0.1:8000/healthz
            echo "DEPLOY_OK ${{ github.sha }}"
