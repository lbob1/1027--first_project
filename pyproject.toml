[project]
name = "pyknora"
version = "0.1.0"
description = "MiniKnora: lightweight teaching variant of PyKnora - FastAPI + LangGraph RAG knowledge base backend (PostgreSQL/pgvector, Redis/Celery, MinIO)"
readme = "README.md"
authors = [
    { name = "unidream", email = "tianqihou@qq.com" }
]
requires-python = ">=3.12,<3.14"  # <3.14：jieba 0.42.2 仅 sdist，为 3.14 构建 sdist 失败（S3-T01，项目实际运行 3.12）
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "minio>=7.2",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.3",
    "python-docx>=1.1",
    "celery[redis]>=5.4",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "jieba==0.42.1",
    "langgraph>=1.2.18",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
